name: Gerar nave atirando nos commits

on:
  schedule:
    - cron: "20 6 * * *" # todo dia, 06:20 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/generate_spaceship.py"
      - ".github/workflows/gera_nave_espacial.yml"

permissions:
  contents: write

jobs:
  gera_animacao_nave:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar animacao
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_spaceship.py

      - name: Commitar se houve mudanca
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/spaceship.svg; then
            echo "Sem mudancas."
            exit 0
          fi
          git add docs/spaceship.svg
          git commit -m "Atualiza nave com os commits mais recentes"
          git push
