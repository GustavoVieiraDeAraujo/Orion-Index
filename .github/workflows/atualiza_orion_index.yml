name: Atualizar Orion Index

on:
  schedule:
    - cron: "0 6 * * *" # todo dia, 06:00 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/generate.py"
      - ".github/workflows/atualiza_orion_index.yml"

permissions:
  contents: write

jobs:
  atualiza_perspectivas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar graficos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/generate.py

      - name: Commitar se houve mudanca
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs; then
            echo "Sem mudancas."
            exit 0
          fi
          git add docs
          git commit -m "Atualiza Orion Index"
          for tentativa in 1 2 3 4 5; do
            git push && break
            echo "Push rejeitado (outro workflow commitou antes), tentativa $tentativa..."
            git pull --rebase -X ours origin main
          done
