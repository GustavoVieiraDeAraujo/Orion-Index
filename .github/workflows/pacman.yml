name: Gerar Pac-Man comendo os commits

on:
  schedule:
    - cron: "0 6 * * *" # todo dia, 06:00 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/generate_pacman.py"
      - ".github/workflows/pacman.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar animacao
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_pacman.py

      - name: Commitar se houve mudanca
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/pacman.svg; then
            echo "Sem mudancas."
            exit 0
          fi
          git add docs/pacman.svg
          git commit -m "Atualiza Pac-Man com os commits mais recentes"
          git push
