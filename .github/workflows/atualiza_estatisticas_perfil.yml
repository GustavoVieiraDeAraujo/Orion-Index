name: Atualizar estatisticas do perfil

on:
  workflow_run:
    workflows: ["Atualizar Orion Index"]
    types: [completed]
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/generate_profile_stats.py"
      - ".github/workflows/atualiza_estatisticas_perfil.yml"

permissions:
  contents: write

jobs:
  atualiza_estatisticas_perfil:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar cartoes e atualizar o README do perfil
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_PAT: ${{ secrets.PROFILE_PAT }}
        run: python3 scripts/generate_profile_stats.py

      - name: Commitar cartoes se houve mudanca
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs; then
            echo "Sem mudancas nos cartoes."
            exit 0
          fi
          git add docs
          git commit -m "Atualiza Orion Index"
          for tentativa in 1 2 3 4 5; do
            git push && break
            echo "Push rejeitado (outro workflow commitou antes), tentativa $tentativa..."
            git pull --rebase -X ours origin main
          done
